<!DOCTYPE html>
<html>
<head>
    <title>Swara Event Management</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <h1>Welcome to Swara Event Management</h1>

    <div class="slideshow-container">
        {% for event in events %}
        <div class="slide">
            <img src="{{ event.image.url }}" alt="{{ event.title }}" style="width:100%;">
            <div class="text">{{ event.title }}</div>
        </div>
        {% endfor %}
    </div>

    <a href="{% url 'add_event' %}">Add Event</a>
</body>
</html>
